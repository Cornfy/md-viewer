name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: md-viewer
            asset_name: md-viewer-x86_64-unknown-linux-gnu
            archive: tar.gz

          # Linux ARM64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: md-viewer
            asset_name: md-viewer-aarch64-unknown-linux-gnu
            archive: tar.gz

          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: md-viewer
            asset_name: md-viewer-aarch64-apple-darwin
            archive: tar.gz

          # macOS Intel (直接在 macos-latest 上交叉编译)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: md-viewer
            asset_name: md-viewer-x86_64-apple-darwin
            archive: tar.gz

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: md-viewer.exe
            asset_name: md-viewer-x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 仅在 Linux 上安装 WebKitGTK 开发库
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # 打包 Unix 二进制 (Linux & macOS)
      - name: Package Unix Binary
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} staging/
          cd staging
          tar -czvf ../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          cd ..

      # 打包 Windows 二进制
      - name: Package Windows Binary
        if: matrix.archive == 'zip'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} staging/
          cd staging
          Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath ../${{ matrix.asset_name }}.zip
          cd ..

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}.${{ matrix.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
